name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      MONOSPACE_SECRETS: memory
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest -q
      - name: CLI smoke
        run: |
          uv run monospace --version
          MONOSPACE_HOME=$RUNNER_TEMP/ms uv run monospace doctor --offline --json || true
