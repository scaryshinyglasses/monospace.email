name: release-notes
# Every push to main: add its commits to CHANGELOG.md › Unreleased and refresh the "What's new"
# blocks in README.md and website/ (index.html + changelog.json), then commit that back.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  notes:
    # Pushes made with GITHUB_TOKEN don't trigger workflows, but guard against loops anyway.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main
      - name: Collect commits and render
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python3 scripts/release_notes.py collect "$BEFORE..$AFTER"
          python3 scripts/release_notes.py render
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "release notes already current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update release notes [skip ci]"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
