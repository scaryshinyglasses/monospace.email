[project]
name = "monospace"
version = "0.1.0"
description = "monospace.email — a terminal email client with images, GIFs, and an MCP server for AI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tanmay Sheoran", email = "sheoran.tanmay.social@gmail.com" }]
keywords = ["email", "imap", "smtp", "tui", "terminal", "mcp", "gmail", "outlook"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email :: Email Clients (MUA)",
]
dependencies = [
    "textual>=8.2.0",
    "textual-image>=0.8.0",
    "Pillow>=11.0.0",
    "imapclient>=3.0.1",
    "aiosmtplib>=3.0.2",
    "keyring>=25.0.0",
    "cryptography>=43.0.0",
    "msal>=1.31.0",
    "google-auth-oauthlib>=1.2.1",
    "selectolax>=1.0",
    "markdown>=3.7",
    "httpx>=0.28.0",
    "mcp>=1.2.0",
]

[project.urls]
Homepage = "https://monospace.email"
Repository = "https://github.com/scaryshinyglasses/monospace.email"
Issues = "https://github.com/scaryshinyglasses/monospace.email/issues"

[project.scripts]
monospace = "monospace.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "aiosmtpd>=1.4.6",
    "textual-dev>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monospace"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
